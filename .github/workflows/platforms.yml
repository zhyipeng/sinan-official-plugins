name: Official plugin platform builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
          - runner: windows-2022
            os: windows
          - runner: ubuntu-24.04
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/clipboard/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      # Only file/data tests and fake clipboard utilities. Never open desktop UI
      # or read the runner's real clipboard.
      - run: npm test
      - run: node scripts/build.mjs
      - run: node scripts/build-clipboard.mjs --target=${{ matrix.os }}-arm64 --target=${{ matrix.os }}-amd64
      - run: node scripts/build-translate.mjs --target=${{ matrix.os }}-arm64 --target=${{ matrix.os }}-amd64
      - run: node scripts/build-calendar.mjs
      - run: node scripts/build-calculator.mjs --target=${{ matrix.os }}-arm64 --target=${{ matrix.os }}-amd64
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/assets.json
          if-no-files-found: error
