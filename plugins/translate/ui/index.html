<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻译</title><link rel="stylesheet" href="style.css"></head>
<body><main>
 <div class="toolbar"><label>原文语言<select id="source" aria-label="原文语言"><option value="auto">自动识别</option></select></label><span class="arrow" aria-hidden="true">→</span><label>目标语言<select id="target" aria-label="目标语言"><option value="smart">常用语言（自动）</option></select></label><label class="engine">翻译引擎<select id="engine" aria-label="翻译引擎"></select></label></div>
 <div id="llm-controls" class="llm-controls" hidden><label for="llm-profile">LLM 配置</label><select id="llm-profile" aria-label="LLM 配置"></select><button id="llm-refresh" class="secondary" type="button">刷新配置</button></div>
 <section id="workspace" class="workspace"><div class="pane"><div class="caption"><label for="input">原文</label><span id="count">0 / 5000</span></div><textarea id="input" placeholder="输入要翻译的文本" spellcheck="false" maxlength="10000"></textarea></div><div class="pane output"><div class="caption"><span id="direction">译文</span><span class="result-actions"><span id="state"></span><button id="copy" class="copy" type="button" disabled title="复制译文（⌘/Ctrl + C）">复制</button></span></div><pre id="output" tabindex="0" aria-label="翻译结果"></pre></div></section>
 <footer><span id="status" role="status" aria-live="polite">文本将发送至所选翻译服务</span><button id="translate" type="button" disabled>翻译</button></footer>
</main><script type="module" src="app.js"></script></body></html>
