<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字识别</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <div class="toolbar"><button id="start" type="button">识别剪贴板图片</button><button id="cancel" class="secondary" type="button" hidden>取消</button><button id="copy" class="secondary copy" type="button" disabled>复制结果</button></div>
  <figure id="original" hidden><img id="preview" alt="原始图片"></figure>
  <label class="caption" for="output">识别结果</label>
  <textarea id="output" spellcheck="false" aria-label="识别结果" placeholder="粘贴图片开始识别"></textarea>
  <footer><span id="status" role="status" aria-live="polite">离线识别，不保存图片</span><span id="count"></span></footer>
</main><script type="module" src="app.js"></script></body></html>
