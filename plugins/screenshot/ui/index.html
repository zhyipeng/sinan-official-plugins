<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图</title><link rel="stylesheet" href="painterro.css"><link rel="stylesheet" href="style.css"></head>
<body><main><header><button id="start" class="primary">区域截图</button><span id="dimensions"></span><button id="copy" disabled>复制并关闭</button><button id="save" disabled>保存 PNG</button><button id="import">导入图片</button><button id="ocr" disabled>OCR 识别</button></header>
